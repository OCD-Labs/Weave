name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        working-directory: server
        run: go mod download

      - name: Run tests
        working-directory: server
        run: go test ./... -v -count=1 -timeout 60s

      - name: Run fuzz tests (seed corpus only)
        working-directory: server
        run: |
          go test ./indexer -run=FuzzDecodeAssetAddedData -v -count=1
          go test ./indexer -run=FuzzDecodeBigIntFromLogData -v -count=1

  ts-test:
    name: TypeScript Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  forge-test:
    name: Solidity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -v

      - name: Run gas snapshot
        run: forge snapshot --check --no-match-test "testFuzz"