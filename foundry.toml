[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = false 

[rpc_endpoints]
robinhood_testnet = "${RPC_URL}"

[etherscan]
robinhood_testnet = { key = "verifykey", url = "https://explorer.testnet.chain.robinhood.com/api/", chain = 46630 }

[fmt]
line_length     = 100
tab_width       = 4
bracket_spacing = true